<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>VYBE — My Events</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        :root {
            --bg: #07090d;
            --surface: #0d1118;
            --surface2: #131925;
            --border: #252d3a;
            --text: #f5f7fb;
            --muted: #8993a5;
            --primary: #8b7cff;
        }

        .theme-toggle {
            position: absolute;
            opacity: 0;
        }

        .theme-toggle:checked~.app {
            --bg: #f5f6fa;
            --surface: #fff;
            --surface2: #f0f2f7;
            --border: #dfe3eb;
            --text: #10131a;
            --muted: #687181;
        }

        body {
            font-family: Inter, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        .app {
            min-height: 100vh;
            background: var(--bg);
        }

        .header {
            height: 76px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 6%;
            gap: 35px;
            background: var(--surface);
        }

        .logo {
            font-size: 27px;
            font-weight: 900;
        }

        .nav {
            display: flex;
            gap: 25px;
            color: var(--muted);
        }

        .actions {
            margin-left: auto;
        }

        .theme-button {
            width: 42px;
            height: 42px;
            border: 1px solid var(--border);
            border-radius: 50%;
            display: grid;
            place-items: center;
            cursor: pointer;
            background: var(--surface2);
        }

        .theme-button:before {
            content: "☾"
        }

        .theme-toggle:checked~.app .theme-button:before {
            content: "☀";
        }

        .container {
            padding: 45px 6%;
        }

        h1 {
            font-size: 45px;
        }

        .sub {
            color: var(--muted);
            margin: 8px 0 30px;
        }

        .layout {
            display: grid;
            grid-template-columns: 1.5fr .7fr;
            gap: 25px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 25px;
        }

        .event-header {
            display: flex;
            gap: 18px;
            align-items: center;
        }

        .thumb {
            width: 140px;
            height: 100px;
            border-radius: 13px;
            overflow: hidden;
            flex-shrink: 0;
        }

        .thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .meta {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.7;
            margin-top: 8px;
        }

        .status {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 20px;
            background: #173e30;
            color: #5be09d;
            font-size: 11px;
            font-weight: 800;
        }

        .qr {
            width: 170px;
            height: 170px;
            margin: 25px auto;
            background:
                linear-gradient(90deg, #111 9px, transparent 9px) 0 0/25px 25px,
                linear-gradient(#111 9px, transparent 9px) 0 0/25px 25px,
                #fff;
            border: 12px solid white;
        }

        .btn {
            display: block;
            text-align: center;
            padding: 13px;
            border-radius: 10px;
            background: var(--primary);
            color: white;
            font-weight: 700;
            margin-top: 15px;
        }

        .past {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }

        .past-image {
            height: 120px;
            border-radius: 12px;
            overflow: hidden;
            margin-top: 15px;
        }

        .past-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        @media(max-width:800px) {
            .nav {
                display: none
            }

            .header {
                padding: 0 20px
            }

            .container {
                padding: 30px 20px
            }

            .layout {
                grid-template-columns: 1fr
            }
        }

        @media(max-width:500px) {
            .event-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .thumb {
                width: 100%;
                height: 170px;
            }
        }
    </style>
</head>

<body>

    <input type="checkbox" id="theme" class="theme-toggle">

    <div class="app">

        <header class="header">

            <a href="home.html" class="logo">VYBE</a>

            <nav class="nav">
                <a href="discover.html">Discover</a>
                <a href="calendar.html">Calendar</a>
                <a href="my-events.html">My Events</a>
            </nav>

            <div class="actions">
                <label for="theme" class="theme-button"></label>
            </div>

        </header>

        <main class="container">

            <h1>My Events</h1>

            <p class="sub">
                Your upcoming experiences in one place.
            </p>

            <div class="layout">

                <div class="card">

                    <span class="status">CONFIRMED</span>

                    <div class="event-header" style="margin-top:18px">

                        <div class="thumb">

                            <img src="https://images.unsplash.com/photo-1492684223066-81342ee5ff30?auto=format&fit=crop&w=1000&q=80"
                                alt="Neon Nights">

                        </div>

                        <div>

                            <h2>Neon Nights</h2>

                            <p class="meta">
                                October 6, 2026<br>
                                7:00 PM · Main Campus Arena
                            </p>

                        </div>

                    </div>

                    <a href="success.html" class="btn">
                        View Pass
                    </a>

                    <div class="past">

                        <h3>Past event</h3>

                        <div class="past-image">

                            <img src="https://images.unsplash.com/photo-1533174072545-7a4b6ad7a6c3?auto=format&fit=crop&w=1000&q=80"
                                alt="Campus festival">

                        </div>

                        <p class="meta">
                            Navratri Night · October 1
                        </p>

                    </div>

                </div>

                <div class="card">

                    <h2>Your Pass</h2>

                    <div class="qr"></div>

                    <p style="text-align:center;color:var(--muted)">
                        Show this QR code at the entrance.
                    </p>

                </div>

            </div>

        </main>

    </div>

</body>

</html>
